services:
  embedding-service:
    build: .
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      # When set (via an untracked .env next to this file), /process-document-url
      # requires "Authorization: Bearer <key>"; empty leaves the endpoint open.
      - PDF_IMPORT_API_KEY=${PDF_IMPORT_API_KEY:-}
    ports:
      - "8888:8888"
    volumes:
      - model_cache:/app/model_cache

    restart: unless-stopped

volumes:
  model_cache:

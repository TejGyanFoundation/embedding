[tool.poetry]
name = "embedding-service"
version = "0.1.0"
description = "FastAPI server for sentence embeddings"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
sentence-transformers = "^2.2.2"
torch = "^2.2.0"
safetensors = "^0.4.1"
gunicorn = "^21.2.0"
shrulipi-to-unicode = {path = "../shrulipi-to-unicode", develop = true}
requests = "^2.34.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
